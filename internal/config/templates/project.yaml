# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/ghok/main/schema/project.schema.json
#
# ghok project config. Created by `ghok config init` (scope: project).
#
# Commit this file to share policy and hooks with everyone using the repository.
# Declarative tightening, rules and protected repositories apply automatically;
# they can never weaken the user policy. runtime/logging are not allowed here.
# Hooks run only after each user inspects them and runs `ghok config trust`.
# Trust retains content digests across versions/worktrees/clones. The v1 manifest
# sorts relative paths with NUL-separated executable bits and SHA256/missing
# markers, covering exact YAML bytes, root-contained hooks and trust.include.
# Any covered byte/exec-bit change requires re-trust; notes name changed files.
# Manifest files/symlink targets must stay under the root and be regular files:
# at most 256 files, with total bytes bounded by effective runtime.fileMaxBytes.
# Absolute external executables, interpreters, PATH tools and unlisted imports,
# dependencies/data are not hashed. Add repository files with trust.include below.
# Policy-only configs skip manifest computation. Trust output lists hashed files,
# hook IDs and coverage limits; `ghok config trust --list` lists all digests with
# first paths, timestamps, hook IDs, exec bits, hashes/missing markers and notes.
# `ghok config untrust` removes only the current digest, leaving policy active;
# `ghok config untrust --all` clears every digest. Invalid/old stores grant no trust.
# Content trust is not repository identity or a concurrent-replacement boundary.
# Docs: https://github.com/mkusaka/ghok

version: 1

# Project-only: include imported scripts, dependencies or data in content trust.
# trust:
#   include:
#     - .github/scripts/check-pr-description.ts
#     - .gitleaks.toml

policy:
  # Only a stricter value than the user config takes effect:
  # mode: observe < enforce; unknownMutation / unknownInput / protectedUnknown: allow < audit < deny
  # mode: enforce
  # unknownMutation: deny
  # unknownInput: deny

  # owner/repo globs this project wants protected (added to the user list).
  protectedRepositories: []
  #  - my-org/my-repo

  rules: []
  #  - id: no-direct-merge
  #    match:
  #      operation: pr.merge.direct     # action glob; see `ghok explain -- <gh args>`
  #    decision: deny                   # deny | audit
  #    onUnresolved: deny               # deny (default): conservative target match | ignore: skip
  #    reason: use the merge queue

# Hook IDs must not collide with hooks in the user config. Project commands must
# use ./relative or absolute paths (user hooks may use bare PATH names).
# Relative paths resolve under the repo root. Hooks are trusted code run as you.
hooks: []
#  - id: project-pre-merge
#    phase: pre                      # pre | post
#    match:
#      operation: "pr.merge.*"
#    command: ["./scripts/ghok/pre-merge"]
#    timeout: 10s
#    onError: deny                   # deny | allow | ignore
