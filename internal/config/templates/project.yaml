# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/ghok/main/schema/project.schema.json
#
# ghok project config. Created by `ghok config init` (scope: project).
#
# Commit this file to share policy and hooks with everyone using the repository.
# Declarative tightening, rules and protected repositories apply automatically;
# they can never weaken the user policy. runtime/logging/trust are not allowed here.
# Hooks run only after each user inspects them and runs:
#   ghok config trust
# Any byte edit to .ghok.yaml (including a git pull) disables its hooks until
# `ghok config trust` is run again. Hook executable contents are not hashed.
# Docs: https://github.com/mkusaka/ghok

version: 1

policy:
  # Only a stricter value than the user config takes effect:
  # mode: observe < enforce; unknownMutation / protectedUnknown: allow < audit < deny
  # mode: enforce
  # unknownMutation: deny

  # owner/repo globs this project wants protected (added to the user list).
  protectedRepositories: []
  #  - my-org/my-repo

  rules: []
  #  - id: no-direct-merge
  #    match:
  #      operation: pr.merge.direct     # action glob; see `ghok explain -- <gh args>`
  #    decision: deny                   # deny | audit
  #    reason: use the merge queue

# Hook IDs must not collide with hooks in the user config. Relative commands
# resolve against this file's directory. Hooks are trusted code that runs as you.
hooks: []
#  - id: project-pre-merge
#    phase: pre                      # pre | post
#    match:
#      operation: "pr.merge.*"
#    command: ["./scripts/ghok/pre-merge"]
#    timeout: 10s
#    onError: deny                   # deny | allow | ignore
