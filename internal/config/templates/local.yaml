# yaml-language-server: $schema=https://raw.githubusercontent.com/mkusaka/ghok/main/schema/local.schema.json
#
# ghok local config. Created by `ghok config init --scope local`.
#
# Personal settings for this checkout only (like CLAUDE.local.md). Keep it
# uncommitted: `config init` added it to .git/info/exclude, and ghok ignores it
# while git tracks it. Loaded after the user config and .ghok.yaml. Its hooks and
# transforms run WITHOUT `ghok config trust`; policy can only tighten the others.
# runtime, logging and trust are not allowed here.
# Docs: https://github.com/mkusaka/ghok

version: 1

policy:
  rules: []
