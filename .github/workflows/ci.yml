name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native platform
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
        env:
          # Keep subprocess version probes from competing with other test packages.
          GOFLAGS: -p=1
      - name: Race test
        run: go test -race ./...
        env:
          GOFLAGS: -p=1
      - name: Fuzz smoke
        # Iteration-bounded: a time-bounded -fuzztime can fail with "context
        # deadline exceeded" when a worker is slow to stop on a loaded runner.
        run: |
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 200000x ./internal/normalize/apiargs
          go test -run '^$' -fuzz '^FuzzNormalize$' -fuzztime 200000x ./internal/normalize/native
          go test -run '^$' -fuzz '^FuzzNormalizeREST$' -fuzztime 200000x ./internal/normalize/rest
          go test -run '^$' -fuzz '^FuzzNormalizeGraphQL$' -fuzztime 200000x ./internal/normalize/graphql
          go test -run '^$' -fuzz '^FuzzRedactString$' -fuzztime 200000x ./internal/redact
      - name: Build
        run: make build
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/ghok-cross"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/ghok-cross/ghok_${os}_${arch}" ./cmd/ghok
            done
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint (linux)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: binary
          args: ./...
      - name: golangci-lint (darwin build constraints)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: darwin
        with:
          version: v2.14.0
          install-mode: binary
          args: ./...
