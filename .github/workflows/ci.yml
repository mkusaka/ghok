name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native platform
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_OS"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
        env:
          # Keep subprocess version probes from competing with other test packages.
          GOFLAGS: -p=1
      - name: Race test
        run: go test -race ./...
        env:
          GOFLAGS: -p=1
      - name: Fuzz smoke
        run: |
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s ./internal/normalize/apiargs
          go test -run '^$' -fuzz '^FuzzNormalize$' -fuzztime 10s ./internal/normalize/native
          go test -run '^$' -fuzz '^FuzzNormalizeREST$' -fuzztime 10s ./internal/normalize/rest
          go test -run '^$' -fuzz '^FuzzNormalizeGraphQL$' -fuzztime 10s ./internal/normalize/graphql
          go test -run '^$' -fuzz '^FuzzRedactString$' -fuzztime 10s ./internal/redact
      - name: Build
        run: make build
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/ghok-cross"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/ghok-cross/ghok_${os}_${arch}" ./cmd/ghok
            done
          done
