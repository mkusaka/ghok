name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source
        env:
          GOFLAGS: -p=1
        run: |
          go build ./...
          go test ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          commit="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          stage="$(mktemp -d "$RUNNER_TEMP/ghok-release.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              name="ghok_${VERSION}_${os}_${arch}"
              mkdir "$stage/$name"
              GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
                -ldflags "-s -w -X main.version=$VERSION -X main.commit=$commit" \
                -o "$stage/$name/ghok" ./cmd/ghok
              cp README.md LICENSE "$stage/$name/"
              tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
                -C "$stage" -cf - "$name" | gzip -n > "dist/$name.tar.gz"
            done
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'dist/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "$VERSION" --generate-notes
