version: 2

builds:
  - main: ./cmd/ghok
    binary: ghok
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # Created as a draft so every asset is attached before publication; the
  # release workflow publishes it afterwards (immutable releases lock assets
  # and the tag once a release is published).
  draft: true
  replace_existing_draft: true
  prerelease: auto
